<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sai Baba Arul 🙏</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#fffaf0;--c2:#ffe7ae;--c3:#ffbd6b;--c4:#e8863a;--ink:#7a3200;--soft:#a35a1f;--card:rgba(255,252,243,.78);--gold:#e3a72f;--glow:rgba(255,200,90,.6);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#6b3510;--c2:#4a2009;--c3:#2d1106;--c4:#1c0a04;--ink:#ffe9b0;--soft:#f3c887;--card:rgba(50,22,8,.72)}}
:root[data-theme="dark"]{--c1:#6b3510;--c2:#4a2009;--c3:#2d1106;--c4:#1c0a04;--ink:#ffe9b0;--soft:#f3c887;--card:rgba(50,22,8,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Mukta Malar','Nirmala UI','Latha','Noto Sans Tamil',system-ui,sans-serif;overflow-x:hidden;
background:radial-gradient(ellipse at 50% 38%,var(--c1),var(--c2) 38%,var(--c3) 72%,var(--c4));background-color:var(--c3);background-attachment:fixed}
.rays{position:fixed;left:50%;top:38%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;z-index:0;pointer-events:none;opacity:.35;
background:repeating-conic-gradient(from 0deg,rgba(255,225,130,.55) 0 6deg,transparent 6deg 16deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%);animation:spin 120s linear infinite}
.temple{position:fixed;left:0;right:0;bottom:0;width:100%;height:46vh;z-index:0;pointer-events:none;opacity:.5}
.temple *{fill:#b86a1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .temple *{fill:#f0a84a}}
:root[data-theme="dark"] .temple *{fill:#f0a84a}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:20px 18px 48px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{font-family:'Cormorant Garamond',serif;font-weight:800;letter-spacing:.08em;color:var(--soft);font-size:15px;margin:4px 0 0}
.om{font-size:20px;color:var(--gold);margin:0 0 6px}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,9vw,46px);line-height:1.25;margin:6px 0 4px;font-weight:800;background:linear-gradient(90deg,#c25a00,#f0a500,#c25a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px var(--glow))}
.sub{font-size:clamp(17px,4.6vw,21px);color:var(--soft);margin:0 0 14px;font-weight:600}
.photoWrap{position:relative;width:min(78vw,310px);margin:10px auto 0}
.halo{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);animation:breathe 4s ease-in-out infinite}
.frame{position:relative;aspect-ratio:3/4;border-radius:999px 999px 26px 26px;border:5px solid var(--gold);outline:3px solid rgba(255,240,180,.7);outline-offset:5px;overflow:hidden;cursor:pointer;
background:linear-gradient(180deg,#fff6d8,#ffd98a);box-shadow:0 0 0 2px #fff3b8 inset,0 16px 50px rgba(160,80,0,.45),0 0 60px var(--glow);display:grid;place-items:center}
.frame img,.frame .pic{position:absolute;inset:0;width:100%;height:100%;background:center/cover no-repeat}
.ph{text-align:center;color:#8a3b00;padding:18px}
.ph svg{width:62%;filter:drop-shadow(0 0 14px rgba(255,190,60,.9))}
.ph p{margin:6px 0 0;font-weight:600;font-size:15px}
.dice-zone{margin-top:34px;display:flex;flex-direction:column;align-items:center}
.scene{--s:96px;width:var(--s);height:var(--s);perspective:650px;cursor:pointer;animation:float 3.2s ease-in-out infinite;outline:none}
.scene.busy{animation:none;cursor:default}
.hop{width:100%;height:100%;transform-style:preserve-3d}
.hop.roll{animation:hop 2.5s cubic-bezier(.3,.6,.4,1)}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-28deg) rotateY(32deg);transition:transform 2.5s cubic-bezier(.12,.7,.18,1)}
.face{position:absolute;inset:0;border-radius:16px;background:radial-gradient(circle at 28% 22%,#fff7c2,#f6c945 42%,#bf7a14);border:2px solid #fff1a6;box-shadow:inset 0 0 20px rgba(110,50,0,.4),0 0 14px rgba(255,200,60,.5);backface-visibility:hidden}
.pip{position:absolute;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a5a,#a3120c 70%);box-shadow:0 0 0 2px #ffe27a,inset 0 -2px 3px rgba(0,0,0,.35)}
.f1{transform:translateZ(48px)}.f6{transform:rotateY(180deg) translateZ(48px)}.f3{transform:rotateY(90deg) translateZ(48px)}.f4{transform:rotateY(-90deg) translateZ(48px)}.f2{transform:rotateX(90deg) translateZ(48px)}.f5{transform:rotateX(-90deg) translateZ(48px)}
.shadow{width:84px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(110,50,0,.45),transparent 70%);margin-top:22px;animation:shad 3.2s ease-in-out infinite}
.shadow.busy{animation:shadroll 2.5s ease}
.hint{margin:12px 0 0;font-size:17px;font-weight:600;color:var(--soft);min-height:28px;transition:opacity .4s}
#res{display:none;width:100%;margin-top:14px;position:relative}
#res.show{display:block}
.card{position:relative;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid var(--gold);outline:3px dashed rgba(227,167,47,.55);outline-offset:-10px;border-radius:26px;padding:26px 18px 22px;box-shadow:0 0 50px var(--glow),0 16px 40px rgba(130,60,0,.3);animation:reveal 1s cubic-bezier(.2,1.2,.3,1) both}
.card::before{content:"";position:absolute;left:50%;top:40px;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid var(--gold);animation:ring 1.4s ease-out both}
.ans{font-family:'Cormorant Garamond',serif;font-weight:800;font-size:clamp(38px,12vw,56px);line-height:1.2;margin:4px 0 8px;background:linear-gradient(100deg,#c25a00,#ffc83d,#c25a00,#ffc83d);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite;filter:drop-shadow(0 2px 8px var(--glow))}
.bmsg{font-size:18px;font-weight:600;margin:0 auto 16px;max-width:400px;line-height:1.5}
.again{border:0;border-radius:999px;padding:12px 26px;font:800 20px 'Mukta Malar','Nirmala UI',sans-serif;color:#fff;background:linear-gradient(135deg,#ffb23d,#e8630a);box-shadow:0 8px 20px rgba(220,100,10,.45);cursor:pointer;transition:transform .2s}
.again:hover{transform:translateY(-2px) scale(1.04)}.again:active{transform:scale(.95)}
.sai{margin:18px 0 0;font-family:'Cormorant Garamond',serif;font-weight:800;color:var(--soft);font-size:16px;letter-spacing:.04em}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:20;border:2px solid var(--gold);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 15px 'Mukta Malar','Nirmala UI',sans-serif;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.petal{position:fixed;top:-30px;z-index:1;pointer-events:none;border-radius:60% 0 60% 60%;animation:fall linear forwards;will-change:transform}
.spark{position:fixed;bottom:-10px;z-index:1;pointer-events:none;border-radius:50%;background:#fff6c0;box-shadow:0 0 8px 3px rgba(255,205,70,.9);animation:rise linear forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shad{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.8);opacity:.6}}
@keyframes shadroll{0%{transform:scale(1)}20%{transform:scale(.4);opacity:.3}45%{transform:scale(1)}60%{transform:scale(.7);opacity:.5}100%{transform:scale(1)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}18%{transform:translateY(-120px) scale(1.25)}40%{transform:translateY(0) scale(.95)}55%{transform:translateY(-44px) scale(1.08)}72%{transform:translateY(0) scale(1)}84%{transform:translateY(-12px)}100%{transform:translateY(0)}}
@keyframes reveal{0%{opacity:0;transform:scale(.5) translateY(30px)}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(22)}}
@keyframes shine{to{background-position:-250% 0}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.95}100%{transform:translate(var(--dx),112vh) rotate(var(--rot));opacity:.85}}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-105vh) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="rays"></div>
<svg class="temple" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <rect x="60" y="178" width="280" height="22"/><rect x="82" y="156" width="236" height="22"/><rect x="104" y="134" width="192" height="22"/><rect x="126" y="112" width="148" height="22"/><rect x="148" y="90" width="104" height="22"/><rect x="170" y="68" width="60" height="22"/><path d="M178 68 L200 36 L222 68Z"/><ellipse cx="200" cy="32" rx="6" ry="9"/><rect x="199" y="14" width="2" height="12"/>
  <rect x="10" y="160" width="40" height="40"/><path d="M14 160 L30 132 L46 160Z"/><rect x="350" y="160" width="40" height="40"/><path d="M354 160 L370 132 L386 160Z"/>
  <g style="fill:#fff3c4;opacity:.8"><rect x="186" y="150" width="28" height="28" rx="14"/><rect x="178" y="106" width="8" height="12" rx="4"/><rect x="214" y="106" width="8" height="12" rx="4"/></g>
</svg>
<button class="mute" id="mute" aria-label="Music">🔊 Music</button>
<input type="file" id="pin" accept="image/*" hidden>

<main class="wrap">
  <div class="om">ॐ</div>
  <p class="brand">SAI BABA ARUL</p>
  <h1>Want it? Or not? 🥺</h1>
  <p class="sub">Shall we see what Sai Baba says?</p>

  <div class="photoWrap">
    <div class="halo"></div>
    <div class="frame" id="frame" title="Tap to add a photo">
      <div class="pic" id="pic"></div>
      <div class="ph" id="ph">
        <svg viewBox="0 0 120 120"><defs><radialGradient id="g"><stop offset="0" stop-color="#fff7c0"/><stop offset="1" stop-color="#ffb93d" stop-opacity="0"/></radialGradient></defs><circle cx="60" cy="56" r="52" fill="url(#g)"/><circle cx="60" cy="38" r="13" fill="#d9801f"/><path d="M30 92 Q34 56 60 54 Q86 56 90 92 Q60 102 30 92Z" fill="#d9801f"/><path d="M22 94 Q60 108 98 94" stroke="#b86a1c" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
        <p>Tap here to add your Sai Baba photo 🙏</p>
      </div>
    </div>
  </div>

  <div class="dice-zone">
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Roll the dice">
      <div class="hop" id="hop"><div class="cube" id="cube"></div></div>
    </div>
    <div class="shadow" id="shadow"></div>
    <p class="hint" id="hint">Tap the dice to roll 🎲</p>
  </div>

  <section id="res" aria-live="polite">
    <div class="card" id="card">
      <div class="ans" id="ans"></div>
      <p class="bmsg" id="bmsg"></p>
      <button class="again" id="again">Roll Again 🎲</button>
    </div>
  </section>
  <p class="sai">Om Sai Ram 🙏 Shraddha • Saburi</p>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};

/* build dice faces */
var P={1:[[50,50]],2:[[25,25],[75,75]],3:[[25,25],[50,50],[75,75]],4:[[25,25],[75,25],[25,75],[75,75]],5:[[25,25],[75,25],[50,50],[25,75],[75,75]],6:[[25,22],[75,22],[25,50],[75,50],[25,78],[75,78]]};
var cube=$("cube");
for(var n=1;n<=6;n++){
  var f=document.createElement("div");f.className="face f"+n;
  P[n].forEach(function(p){var d=document.createElement("i");d.className="pip";d.style.left=p[0]+"%";d.style.top=p[1]+"%";f.appendChild(d)});
  cube.appendChild(f);
}
/* rotation that brings each face to the front */
var T={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};
var cx=-28,cy=32,busy=false;
function nxt(cur,base,turns){
  var m=((cur%360)+360)%360,b=((base%360)+360)%360,d=b-m;if(d<=0)d+=360;
  return cur+d+360*turns;
}
var RES=[
 {t:"I Want It ❤️",m:"Baba says: Follow your heart. Move forward with faith 🙏"},
 {t:"Don’t Want It ❤️",m:"Baba says: Let it go. Only good things are coming your way, so be patient 🙏"}
];
function roll(){
  if(busy)return;busy=true;
  start();
  var yes=Math.random()<0.5;               /* exact 50/50 */
  var odd=[1,3,5],even=[2,4,6],pool=yes?odd:even;
  var face=pool[Math.random()*3|0];
  cx=nxt(cx,T[face][0],2+(Math.random()*2|0));
  cy=nxt(cy,T[face][1],3+(Math.random()*2|0));
  var sc=$("scene"),hop=$("hop");
  sc.classList.add("busy");$("shadow").classList.add("busy");
  hop.classList.remove("roll");void hop.offsetWidth;hop.classList.add("roll");
  $("res").classList.remove("show");
  $("hint").textContent="Baba is looking… 🙏";
  cube.style.transform="rotateX("+cx+"deg) rotateY("+cy+"deg)";
  setTimeout(function(){
    var r=RES[yes?0:1];
    $("ans").textContent=r.t;$("bmsg").textContent=r.m;
    var rs=$("res"),c=$("card");rs.classList.add("show");
    c.style.animation="none";void c.offsetWidth;c.style.animation="";
    $("hint").textContent="";
    sc.classList.remove("busy");$("shadow").classList.remove("busy");
    for(var i=0;i<40;i++)setTimeout(petal,i*25,true);
    for(var j=0;j<14;j++)setTimeout(spark,j*40);
    rs.scrollIntoView({behavior:"smooth",block:"center"});
    busy=false;
  },2650);
}
$("scene").addEventListener("click",roll);
$("scene").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();roll()}});
$("again").addEventListener("click",function(){
  $("res").classList.remove("show");$("hint").textContent="Tap the dice to roll 🎲";
  window.scrollTo({top:0,behavior:"smooth"});setTimeout(roll,450);
});

/* petals & sparkles */
var PC=["#ffb300","#ff8f00","#ff6f91","#fff","#ffd54f","#ff9e80"];
function petal(burst){
  var p=document.createElement("span"),w=9+Math.random()*10,d=burst?3+Math.random()*3:9+Math.random()*8;
  p.className="petal";
  p.style.cssText+="left:"+Math.random()*100+"vw;width:"+w+"px;height:"+w*1.4+"px;background:"+PC[Math.random()*PC.length|0]+";opacity:0;animation-duration:"+d+"s;--dx:"+(Math.random()*140-70)+"px;--rot:"+(Math.random()*720-360)+"deg;box-shadow:0 0 6px rgba(255,200,80,.5)";
  document.body.appendChild(p);setTimeout(function(){p.remove()},d*1000+100);
}
function spark(){
  var s=document.createElement("span"),z=2+Math.random()*4,d=6+Math.random()*7;
  s.className="spark";
  s.style.cssText+="left:"+Math.random()*100+"vw;width:"+z+"px;height:"+z+"px;animation-duration:"+d+"s;--dx:"+(Math.random()*60-30)+"px";
  document.body.appendChild(s);setTimeout(function(){s.remove()},d*1000+100);
}
setInterval(petal,650);setInterval(spark,380);
for(var k=0;k<8;k++){setTimeout(petal,k*200);setTimeout(spark,k*150)}

/* photo (tap frame to add Sai Baba photo) */
var KEY="saiBabaPhoto";
function setPic(u){$("pic").style.backgroundImage="url("+u+")";$("ph").style.display="none"}
try{var sv=localStorage.getItem(KEY);if(sv)setPic(sv)}catch(e){}
$("frame").addEventListener("click",function(){$("pin").click()});
$("pin").addEventListener("change",function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){
    var im=new Image();im.onload=function(){
      var s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      var u=c.toDataURL("image/jpeg",.85);setPic(u);
      try{localStorage.setItem(KEY,u)}catch(e){}
    };im.src=r.result};r.readAsDataURL(f);
});

/* devotional music (WebAudio): tanpura drone + soft bells */
var ac,master,on=false,tm,step=0,muted=false,started=false;
var sc=[261.63,293.66,329.63,392,440,523.25,587.33],ix=2;
function nt(f,t,d,v,type){
  var o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function tick(){
  var t=ac.currentTime,seq=[196,261.63,261.63,130.81];
  nt(seq[step%4],t,3.2,.07,"triangle");nt(seq[step%4]*2,t,2,.02,"sine");
  if(step%2===0){
    ix=Math.max(0,Math.min(sc.length-1,ix+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));
    nt(sc[ix],t+.3,2.2,.08,"sine");nt(sc[ix]*2.01,t+.3,1.2,.025,"sine");
  }
  step++;
}
function play(){
  try{
    if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.9;master.connect(ac.destination)}
    if(ac.state==="suspended")ac.resume();
    if(!on){on=true;step=0;tick();tm=setInterval(tick,1250)}
    $("mute").textContent="🔊 Music";
  }catch(e){}
}
function stop(){on=false;clearInterval(tm);$("mute").textContent="🔇 Music";}
function start(){if(!started&&!muted){started=true;play()}}
document.addEventListener("pointerdown",start,{once:true});
$("mute").addEventListener("click",function(e){
  e.stopPropagation();started=true;
  if(on){muted=true;stop()}else{muted=false;play()}
});
})();
</script>
</body>
</html>
